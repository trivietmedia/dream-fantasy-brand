<path d="M-100 420 C 500 120 900 660 1400 350 S 2200 150 2700 380" stroke="#40f4ff" stroke-width="170" opacity=".75"/>
<path d="M-100 580 C 500 320 1000 790 1500 500 S 2200 360 2700 540" stroke="#c07cff" stroke-width="180" opacity=".7"/>
<path d="M-100 740 C 600 540 1100 920 1600 680 S 2200 580 2700 720" stroke="#ff6cc0" stroke-width="140" opacity=".6"/>
</g>
<circle cx="1280" cy="1000" r="520" fill="#ffd0f0" opacity=".45" filter="url(#blur)"/>
<g fill="#fff">
<circle cx="180" cy="150" r="5"/><circle cx="420" cy="320" r="4"/><circle cx="700" cy="110" r="4"/><circle cx="1000" cy="230" r="3.5"/><circle cx="1500" cy="120" r="4"/><circle cx="1800" cy="260" r="4"/><circle cx="2100" cy="130" r="5"/><circle cx="2380" cy="300" r="4"/><circle cx="2450" cy="120" r="4"/><circle cx="120" cy="520" r="4"/><circle cx="2400" cy="560" r="4"/><circle cx="300" cy="900" r="3.5"/><circle cx="2260" cy="940" r="3.5"/>
</g>
<!-- mountains -->
<path d="M0 1080 L 220 900 L 420 1040 L 700 820 L 980 1050 L 1280 930 L 1560 1060 L 1860 840 L 2120 1030 L 2360 900 L 2560 1040 V1440 H0Z" fill="url(#mt)"/>
<path d="M0 1180 L 300 1040 L 620 1170 L 960 1010 L 1300 1160 L 1700 1000 L 2050 1150 L 2330 1030 L 2560 1140 V1440 H0Z" fill="url(#mt2)"/>
<path d="M0 1260 C 500 1190 900 1300 1400 1240 S 2150 1200 2560 1270 V1440 H0Z" fill="#1a0c52"/>
