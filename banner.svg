<g stroke="url(#neon)" stroke-width="10" stroke-linecap="round">
<line x1="140" y1="1210" x2="140" y2="1320"/><line x1="190" y1="1180" x2="190" y2="1350"/><line x1="240" y1="1220" x2="240" y2="1310"/><line x1="290" y1="1160" x2="290" y2="1370"/><line x1="340" y1="1200" x2="340" y2="1330"/>
<line x1="2220" y1="1200" x2="2220" y2="1330"/><line x1="2270" y1="1160" x2="2270" y2="1370"/><line x1="2320" y1="1220" x2="2320" y2="1310"/><line x1="2370" y1="1180" x2="2370" y2="1350"/><line x1="2420" y1="1210" x2="2420" y2="1320"/>
</g>
<!-- Safe area x 507..2053, y 508..931 -->
<g font-family="'Avenir Next','Montserrat','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
<text x="1280" y="610" font-size="46" font-weight="700" letter-spacing="26" fill="#fff" filter="url(#shadow)">◆ AMBIENT MUSIC ◆</text>
<text x="1280" y="775" font-size="170" font-weight="900" textLength="1440" lengthAdjust="spacingAndGlyphs" fill="url(#txt)" filter="url(#shadow)">DREAM FANTASY</text>
