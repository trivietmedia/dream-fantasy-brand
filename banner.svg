<linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1a8a"/><stop offset="1" stop-color="#05010f"/></linearGradient>
<filter id="blur" filterUnits="userSpaceOnUse" x="-500" y="-500" width="3600" height="2500"><feGaussianBlur stdDeviation="55"/></filter>
