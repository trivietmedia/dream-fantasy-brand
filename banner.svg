<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a9e"/><stop offset="0.45" stop-color="#7a4ae8"/><stop offset="0.75" stop-color="#d77cf0"/><stop offset="1" stop-color="#ffa6dc"/></linearGradient>
<linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2560" y2="0"><stop offset="0" stop-color="#5ff8ff"/><stop offset="0.5" stop-color="#d9a8ff"/><stop offset="1" stop-color="#ff8ad8"/></linearGradient>
<linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#c8fcff"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd0ee"/></linearGradient>
<linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a3fd0"/><stop offset="1" stop-color="#2a1678"/></linearGradient>
<linearGradient id="mt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2aa8"/><stop offset="1" stop-color="#1e0f5c"/></linearGradient>
<filter id="blur" filterUnits="userSpaceOnUse" x="-500" y="-500" width="3600" height="2500"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="3000" height="1800"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="3000" height="1800"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a0a5a" flood-opacity=".65"/></filter>
</defs>
<rect width="2560" height="1440" fill="url(#bg)"/>
