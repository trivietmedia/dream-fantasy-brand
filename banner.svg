<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05010f"/><stop offset="0.6" stop-color="#14063a"/><stop offset="1" stop-color="#2a0f5e"/></linearGradient>
<linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2560" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#b05cff"/><stop offset="1" stop-color="#ff3cac"/></linearGradient>
